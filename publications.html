<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Publications — Rahul Gomes</title>
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  
<div id="site-header"></div>


  <main>
    <div class="container">
      
<h2>Publications</h2>
<div class="card">
  <div class="searchbar">
    <input id="pSearch" type="search" placeholder="Search by author, title, venue, year..." oninput="renderPubs()"/>
  </div>
  <h3>Peer-Reviewed</h3>
  <div id="peer" class="list"></div>
  <h3>Posters & Abstracts</h3>
  <div id="posters" class="list"></div>
  <h3>Regional / Undergraduate Research</h3>
  <div id="regional" class="list"></div>
</div>
<script>
let PUBS=null;
function cite(item){
  const parts = [];
  parts.push(item.authors ? item.authors + '. ' : '');
  parts.push('<strong>'+item.title+'</strong>. ');
  parts.push(item.venue ? item.venue + '. ' : '');
  parts.push(item.year ? item.year : '');
  const doi = item.doi ? ' <a href="https://doi.org/'+item.doi+'" target="_blank">doi:'+item.doi+'</a>' : (item.link ? ' <a target="_blank" href="'+item.link+'">link</a>' : '');
  return '<div class="citation">'+parts.join('')+'<div class="meta">'+doi+'</div></div>';
}
async function renderPubs(){
  if(!PUBS){ PUBS = await fetchJSON('data/publications.json'); }
  const q = qs('pSearch').value;
  const peer = searchFilter(PUBS.peer_reviewed, q, ['title','authors','venue','year']);
  const posters = searchFilter(PUBS.posters_and_abstracts, q, ['title','authors','venue','year']);
  const regional = searchFilter(PUBS.regional_ug, q, ['title','authors','venue','year']);
  qs('peer').innerHTML = peer.sort((a,b)=> b.year - a.year).map(cite).join('');
  qs('posters').innerHTML = posters.sort((a,b)=> b.year - a.year).map(cite).join('');
  qs('regional').innerHTML = regional.sort((a,b)=> b.year - a.year).map(cite).join('');
}
renderPubs();
</script>

    </div>
  </main>
  
<footer class="footer">
  <div class="container">
    © <span id="year"></span> Rahul Gomes — Department of Computer Science, UW–Eau Claire
  </div>
</footer>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
<script src="assets/include-header.js" defer></script>
<script src="assets/script.js" defer></script>
</body>
</html>
